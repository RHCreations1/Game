<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game 02 · Spin the Wheel</title><link rel="stylesheet" href="assets/styles.css"></head><body class="player-theme"><div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">EG</div><div>EVENT EXPERIENCE<div class="eyebrow">GAME 02 · SPIN THE WHEEL</div></div></div></header><main class="hero"><div class="hero-panel">

<div id="regPanel"><div class="eyebrow">WELCOME TO THE GAME</div><h1>Spin &amp; Win!</h1><p class="subtitle">Enter your details to register and start spinning.</p>
<div class="big-input" style="margin-top:20px"><div class="field"><label>PLAYER NAME</label><input id="name" placeholder="Full name" autocomplete="name"></div><div class="field"><label>CONTACT NUMBER</label><input id="phone" placeholder="07X XXX XXXX" inputmode="tel" autocomplete="tel"></div>
<label class="terms"><input type="checkbox" class="toggle" id="agree"><span>I agree to the <a href="#" id="showTerms">Terms &amp; Conditions</a></span></label>
<button class="btn" id="register" style="width:100%;padding:14px">Register &amp; Continue</button></div></div>

<div id="playPanel" class="hidden">
 <div id="wheelStage"><div class="success">YOU ARE REGISTERED — GOOD LUCK!</div>
  <div class="wheel-wrap" id="wheelWrap"><svg id="spinner" class="wheel-spin" viewBox="-230 -230 460 460"></svg><svg id="rim" viewBox="-230 -230 460 460"></svg></div>
  <button class="btn" id="spin" style="min-width:210px;padding:15px;font-size:14px">SPIN THE WHEEL</button></div>
 <div id="resultScreen" class="result-screen hidden"></div>
 <div id="npWrap" style="margin-top:18px"><button class="btn secondary" id="newPlayer">New player</button></div>
</div>

</div></main><div class="footer">POWERED BY EVENT GAMING SYSTEM</div></div>
<div id="termsModal" class="modal hidden"><div class="modal-box"><h2>Terms &amp; Conditions</h2><div id="termsText"></div><button class="btn" id="closeTerms">Close</button></div></div>
<div id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="assets/app.js"></script><script>
let player=null,busy=false;
const ICONS=['🎁','🎀','🎉','⭐'],COLORS=['#20c997','#e5b95f','#db6c80','#78aaff'];
function buildWheel(){
 const d=db(),segs=wheelSegments(d),R=192;let h=`<circle r="${R}" fill="#0d1712"/>`;
 const im=(src,y,sz)=>`<image href="${src}" x="${-sz/2}" y="${y}" width="${sz}" height="${sz}" preserveAspectRatio="xMidYMid meet"/>`,tx=(t,y,fs,fill)=>`<text y="${y}" text-anchor="middle" font-size="${fs}" font-weight="900" letter-spacing="1" fill="${fill}">${esc(t)}</text>`;
 segs.forEach((id,i)=>{
  const a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180,opps=id==='OPPS';
  const fill=opps?(i%4===1?'#1b3f31':'#10271e'):COLORS[(i/2)%4];
  h+=`<path d="M0 0 L${(R*Math.cos(a0)).toFixed(2)} ${(R*Math.sin(a0)).toFixed(2)} A${R} ${R} 0 0 1 ${(R*Math.cos(a1)).toFixed(2)} ${(R*Math.sin(a1)).toFixed(2)} Z" fill="${fill}" stroke="#e5eee8" stroke-width="2"/>`;
  h+=`<g transform="rotate(${i*45+22.5})">`;
  if(opps){const o=oppsInfo(d),fs=Math.max(13,Math.min(30,190/o.label.length));
   if(o.img&&o.showName)h+=tx(o.label,-166,Math.min(15,fs),'#f0bd72')+im(o.img,-146,72);
   else if(o.img)h+=im(o.img,-166,100);
   else if(o.showName)h+=tx(o.label,-110,fs,'#f0bd72');
   else h+=tx('✕',-110,44,'#f0bd72')}
  else{const g=d.gifts.find(x=>x.id===id),img=getImg('gift_'+id),sn=g&&giftShowName(g);
   if(img&&sn)h+=tx((g.name||'').slice(0,11),-166,15,'#071c14')+im(img,-146,72);
   else if(img)h+=im(img,-166,100);
   else{h+=`<text y="-100" text-anchor="middle" font-size="52">${ICONS[(i/2)%4]}</text>`;if(sn)h+=tx((g?.name||'').slice(0,11),-166,15,'#071c14')}}
  h+='</g>'});
 document.getElementById('spinner').innerHTML=h;
 let r=`<defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8dc84"/><stop offset=".5" stop-color="#c9972f"/><stop offset="1" stop-color="#8a5e12"/></linearGradient></defs><circle r="208" fill="none" stroke="url(#gold)" stroke-width="32"/><circle r="192" fill="none" stroke="#4d3308" stroke-width="3"/><circle r="224" fill="none" stroke="#4d3308" stroke-width="3"/>`;
 for(let i=0;i<36;i++){const a=i*10*Math.PI/180;r+=`<circle class="bulb ${i%2?'b':''}" cx="${(208*Math.cos(a)).toFixed(2)}" cy="${(208*Math.sin(a)).toFixed(2)}" r="3.6"/>`}
 const centreLogo=d.settings&&d.settings.wheelLogo;
 if(centreLogo){
   r+=`<circle r="55" fill="#0d1712" stroke="url(#gold)" stroke-width="7"/><circle r="48" fill="none" stroke="#f4d47a" stroke-width="2"/><clipPath id="wheelLogoClip"><circle r="44"/></clipPath><image href="${centreLogo}" x="-44" y="-44" width="88" height="88" preserveAspectRatio="xMidYMid meet" clip-path="url(#wheelLogoClip)"/>`;
 }else{
   r+=`<circle r="52" fill="#0d1712" stroke="url(#gold)" stroke-width="7"/><text y="7" text-anchor="middle" font-size="19" font-weight="900" fill="#f0bd72">SPIN</text>`;
 }
 r+=`<polygon points="-18,-229 18,-229 0,-180" fill="#f5c76a" stroke="#7a4d00" stroke-width="3" stroke-linejoin="round"/>`;
 document.getElementById('rim').innerHTML=r}
function showResult(p){
 const d=db(),box=document.getElementById('resultScreen');document.getElementById('wheelStage').classList.add('hidden');box.classList.remove('hidden');
 if(p.prize==='OPPS'){const o=oppsInfo(d);box.innerHTML=`${o.img?`<img class="gift-pic" src="${o.img}" alt="">`:''}${o.showName?`<div class="opps-big" style="${o.label.length>6?'font-size:clamp(38px,11vw,84px)':''}">${esc(o.label)}</div>`:''}<p class="subtitle" style="font-size:18px">Not this time. Thanks for playing!</p>`;return}
 const img=getImg('gift_'+p.prize);
 box.innerHTML=`<div class="eyebrow">CONGRATULATIONS</div><h2>You won ${esc(prizeName(p.prize,d))}!</h2>${img?`<img class="gift-pic" src="${img}" alt="${esc(prizeName(p.prize,d))}">`:`<div class="gift-emoji">🎁</div>`}<div class="qrbox" id="prizeQr"></div><p class="muted" style="margin:10px 0 2px">Show this QR code at the Gift Collection Point</p><p class="muted" style="font-size:11px">${esc(p.qr)}</p>`;
 qrRender(document.getElementById('prizeQr'),p.qr)}
function showPlayer(p){player=p;document.getElementById('regPanel').classList.toggle('hidden',!!p);document.getElementById('playPanel').classList.toggle('hidden',!p);if(!p)return;document.getElementById('npWrap').classList.toggle('hidden',!canNewPlayer('wheel'));buildWheel();if(p.prize)showResult(p)}
document.getElementById('register').onclick=()=>{let n=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.trim();if(n.length<2||p.replace(/\D/g,'').length<9){notify('Please enter a valid name and contact number');return}if(!document.getElementById('agree').checked){notify('Please accept the Terms & Conditions');return}let c=createPlayer(n,p,'GAME 02 · WHEEL');if(c)showPlayer(c)};
document.getElementById('spin').onclick=()=>{
 if(!player||player.prize||busy)return;busy=true;document.getElementById('spin').disabled=true;
 const wrap=document.getElementById('wheelWrap');wrap.classList.add('spinning');
 const a=award(player.id,'wheel');            /* result is decided first (admin weights + stock) */
 const segs=wheelSegments(),c=segs.map((s,i)=>s===a.prize?i:-1).filter(i=>i>=0),seg=c.length?c[Math.floor(Math.random()*c.length)]:0;
 const jitter=Math.random()*26-13,deg=360*6+(((360-(seg*45+22.5)+jitter)%360)+360)%360;   /* wedge centre lands under the pointer */
 document.getElementById('spinner').style.transform=`rotate(${deg}deg)`;
 setTimeout(()=>{wrap.classList.remove('spinning');showResult(a);busy=false},4500)};
document.getElementById('newPlayer').onclick=()=>{clearActivePlayer('wheel');location.reload()};
applyGameBackground('wheel');initTerms('register');showPlayer(activePlayer('wheel'));
</script></body></html>
